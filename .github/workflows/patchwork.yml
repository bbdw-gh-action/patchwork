name: Patchwork
on:
  workflow_call:
    inputs:
      issue_number:
        description: Número da issue validada pelo adaptador do repositório chamador
        required: true
        type: string
      config_path:
        description: Configuração confiável relativa ao repositório chamador
        type: string
        default: .github/patchwork.json
      node_version:
        description: Versão do Node usada pelo adaptador e, quando aplicável, pela aplicação
        type: string
        default: '24'
      go_version_file:
        description: Caminho relativo à aplicação; vazio desativa a instalação do Go
        type: string
        default: ''
      install_command:
        description: Comando confiável de instalação executado em app, antes do agente e da validação
        type: string
        default: npm ci
      copilot_model:
        description: Modelo Copilot; vazio usa o padrao permitido pela organizacao
        type: string
        default: ''
    secrets:
      SENTRY_AUTH_TOKEN:
        required: true
      PATCHWORK_APP_PRIVATE_KEY:
        required: false
permissions:
  contents: read
concurrency:
  group: patchwork-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false
env:
  PATCHWORK_CONFIG: ${{ inputs.config_path }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      sha: ${{ steps.incident.outputs.sha }}
      issue: ${{ steps.incident.outputs.issue }}
      incident: ${{ steps.incident.outputs.incident }}
    steps:
      - name: Obter o motor Patchwork da revisão chamada
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: patchwork
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ inputs.node_version }}
      - id: incident
        run: node patchwork/scripts/engine.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PATCHWORK_APP_ID: ${{ vars.PATCHWORK_APP_ID }}
          PATCHWORK_BOT_ID: ${{ vars.PATCHWORK_BOT_ID }}
          PATCHWORK_APP_PUBLIC_KEY: ${{ vars.PATCHWORK_APP_PUBLIC_KEY }}
      - name: Conferir identidade resolvida pelo adaptador
        env:
          BASE_SHA: ${{ steps.incident.outputs.sha }}
          RESOLVED_ISSUE: ${{ steps.incident.outputs.issue }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          node --input-type=module <<'NODE'
          if (!/^[a-f0-9]{40}$/.test(process.env.BASE_SHA) || process.env.RESOLVED_ISSUE !== process.env.ISSUE_NUMBER) {
            throw new Error('O adaptador deve retornar o SHA completo e o número da issue recebida.');
          }
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: incident
          path: ${{ runner.temp }}/incident.json
          if-no-files-found: error
          retention-days: 7
  propose:
    needs: prepare
    outputs:
      outcome: ${{ steps.export.outputs.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Obter o motor Patchwork da revisão chamada
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: patchwork
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ inputs.node_version }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: inputs.go_version_file != ''
        with:
          go-version-file: app/${{ inputs.go_version_file }}
          cache: false
      - name: Instalar dependências da aplicação
        run: ${{ inputs.install_command }}
        working-directory: app
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: incident
          path: ${{ runner.temp }}
      - name: Instalar Copilot SDK e MCP Sentry pelo lockfile
        run: npm ci --ignore-scripts --omit=dev
        working-directory: patchwork
      - name: Preparar skills e MCP confiáveis
        run: node patchwork/scripts/context.mjs
      - run: node patchwork/scripts/engine.mjs prompt
      - name: Conferir credencial do MCP
        env:
          SENTRY_ACCESS_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: test -n "$SENTRY_ACCESS_TOKEN" || { echo "::error::Configure SENTRY_AUTH_TOKEN para o MCP."; exit 1; }
      - name: Analisar e corrigir com Copilot SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTRY_ACCESS_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          COPILOT_MODEL: ${{ inputs.copilot_model }}
        run: bash patchwork/scripts/run-agent.sh
      # Após o agente, só exportar a proposta; executar código em outro runner.
      - id: export
        run: node patchwork/scripts/engine.mjs export
        env:
          BASE_SHA: ${{ needs.prepare.outputs.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: proposal
          path: |
            ${{ runner.temp }}/candidate.patch
            ${{ runner.temp }}/handoff.json
            ${{ runner.temp }}/report.md
            ${{ runner.temp }}/agent-context.json
            ${{ runner.temp }}/execution.json
          retention-days: 7
  validate:
    needs: [prepare, propose]
    if: needs.propose.outputs.outcome == 'repair'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter o motor Patchwork da revisão chamada
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: patchwork
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ inputs.node_version }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: inputs.go_version_file != ''
        with:
          go-version-file: app/${{ inputs.go_version_file }}
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: proposal
          path: ${{ runner.temp }}
      - name: Instalar dependências da aplicação
        run: ${{ inputs.install_command }}
        working-directory: app
      - run: node patchwork/scripts/engine.mjs validate
        env:
          BASE_SHA: ${{ needs.prepare.outputs.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation
          path: |
            ${{ runner.temp }}/validation.md
            ${{ runner.temp }}/validation.json
            ${{ runner.temp }}/regression-before.log
          retention-days: 7
  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Obter o motor Patchwork da revisão chamada
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: patchwork
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: app
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ inputs.node_version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: proposal
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validation
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: incident
          path: ${{ runner.temp }}
      - name: Abrir PR sem executar a proposta
        run: node patchwork/scripts/engine.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.prepare.outputs.sha }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue }}
  handoff:
    needs: [prepare, propose]
    if: needs.propose.outputs.outcome == 'handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: handoff-${{ github.repository }}-${{ needs.prepare.outputs.incident }}-${{ needs.prepare.outputs.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: patchwork
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ inputs.node_version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: incident
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: proposal
          path: ${{ runner.temp }}
      - name: Validar e publicar issue vinculada sem executar a proposta
        run: node patchwork/scripts/engine.mjs handoff
        env:
          GH_TOKEN: ${{ github.token }}
          PATCHWORK_APP_ID: ${{ vars.PATCHWORK_APP_ID }}
          PATCHWORK_BOT_ID: ${{ vars.PATCHWORK_BOT_ID }}
          PATCHWORK_INSTALLATION_ID: ${{ vars.PATCHWORK_INSTALLATION_ID }}
          PATCHWORK_APP_PUBLIC_KEY: ${{ vars.PATCHWORK_APP_PUBLIC_KEY }}
          PATCHWORK_APP_PRIVATE_KEY: ${{ secrets.PATCHWORK_APP_PRIVATE_KEY }}
